name: Report

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions: {}

env:
  ASSESSMENTPLAN: "assessment-plan-${{ github.run_id }}.json"
  FRAMEWORK: "SSDF"

jobs:
  generate-posture:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.24'
          cache: false
          check-latest: true

      - name: Setup c2pcli
        uses: jpower432/c2p-actions/actions/setup-c2pcli@0bc42f492f3a6854fe0afc99c50100db8f5e17c6 # main

      - name: Install C2P plugins
        uses: ./.github/actions/install-opa-plugin

      - uses: ./.github/actions/run-checks

      - name: Create An Assessment Plan
        run: |
          go build -C cmd/  -o ../gemara-transformer
          ./gemara-transformer plan -t "GitHub Repository" -v "opa" -r "${FRAMEWORK}" > "${ASSESSMENTPLAN}"

      - name: Aggregate results
        run: c2pcli result2oscal -c configs/c2p-config.yaml -a "${ASSESSMENTPLAN}" -p $(go env GOPATH)/bin

      - uses: actions/upload-artifact@v4
        with:
          name: assessment-plan
          path: ${ASSESSMENTPLAN}

      # Post summary on GitHub action summary
      - name: Summary
        run: c2pcli oscal2posture -c configs/c2p-config.yaml -r assessment-results.json -a "${ASSESSMENTPLAN}" --catalog data/catalogs/catalog.json >> $GITHUB_STEP_SUMMARY